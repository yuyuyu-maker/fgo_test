# Go2 deploy config — switch models by changing `active_model` (or CLI --model).
# Checkpoint paths are relative to the go2_deploy/ project root (not configs/).
#
# Two control modes (shown on the web UI — do not mix):
#   sport — Unitree built-in Sport gait via SportClient.Move (sdk2 / mock)
#   fpo   — Your FPO ONNX policy via C++ LowState→ONNX→LowCmd (UDP cmd bridge)
# Aligned policy numbers: configs/fpo_go2_aligned.yaml

server:
  host: 127.0.0.1
  port: 8080
  deadman_s: 0.35
  # Web command stream rate (sport backend push / UDP forward), not RL policy rate
  control_hz: 50.0

# control_mode: sport | fpo  (override with CLI --mode)
control_mode: sport

# Robot I/O for control_mode=sport only:
#   mock  — log only
#   sdk2  — SportClient.Move (built-in gait; NOT FPO)
# For control_mode=fpo, Python does not drive motors; it only forwards cmds (UDP).
backend:
  name: mock
  iface: eth0
  max_vx: 0.60
  max_vy: 0.40
  max_yaw: 0.80

# --- FPO policy deploy (C++ + ONNX; aligned with Isaac Lab Go2 flat training) ---
# Source of truth for numbers: configs/fpo_go2_aligned.yaml (from env.yaml)
policy:
  # Tunable. Training: decimation=4, sim.dt=0.005 → 50 Hz. Keep 50 unless intentional.
  policy_hz: 50.0
  lowcmd_hz: 500.0
  action_scale: 0.25
  kp: 25.0
  kd: 0.5
  effort_limit: 23.5
  velocity_limit: 30.0
  # FL/FR/RL/RR × hip,thigh,calf — see fpo_go2_aligned.yaml
  default_joint_pos:
    - 0.1
    - 0.8
    - -1.5
    - -0.1
    - 0.8
    - -1.5
    - 0.1
    - 1.0
    - -1.5
    - -0.1
    - 1.0
    - -1.5
  aligned_yaml: configs/fpo_go2_aligned.yaml
  # Idle keys → cmd=(0,0,0); policy still runs at policy_hz (zero-vel track)
  pause_on_idle: false
  onnx_path: exported/baseline/policy.onnx

# Which entry under `models:` to use (FPO mode)
active_model: baseline

# FPO Go2 checkpoints (Isaac Lab flat velocity). Update paths when new runs finish.
models:
  baseline:
    description: "Go2 FPO++ baseline (2500 iters)"
    fpo_variant: baseline
    task: Isaac-Velocity-Flat-Unitree-Go2-v0
    checkpoint: ../isaaclab_experiments/logs/isaaclab_fpo/unitree_go2_flat_flow/2026-08-21_20-43-35_2026-08-21_20-43-28_baseline/model_2499.pt
    sampling_steps: 10
    zero_sampling: true

